!Assay
seqspec_version: 0.3.0
assay_id: 10x-RNA-v4
name: 10x Genomics Chromium GEM-X Single Cell 3' v4 
doi: https://cdn.10xgenomics.com/image/upload/v1725314293/support-documents/CG000731_ChromiumGEM-X_SingleCell3v4_UserGuide_RevB.pdf
date: 3 September 2024
description: 10x Genomics Chromium GEM-X Single Cell 3' v4 using dual Illumina multiplex index
modalities:
- rna
lib_struct: https://teichlab.github.io/scg_lib_structs/methods_html/10xChromium3.html
sequence_protocol: ##PROTOCOL##
sequence_kit: ##SEQ_KIT##
library_protocol: single-cell RNA sequencing assay (OBI:0002631)
library_kit: ##LIB_KIT##

sequence_spec:
- !Read
  read_id: read_1
  name: Read 1
  modality: rna
  primer_id: truseq_read1
  min_len: 28
  max_len: 28
  strand: pos
  files:
  - !File
    file_id: ##R1_File_ID##
    filename: ##R1_Filename##
    filetype: ##R1_Filetype##
    filesize: ##R1_File_Size##
    url: ##R1_URL##
    urltype: ##R1_URL_Type##
    md5: ##R1_MD5##
- !Read
    read_id: index_1
    name: Index 1 (i7 index)
    modality: rna
    primer_id: truseq_read2
    min_len: 10
    max_len: 10
    strand: pos
    files:
    - !File
      file_id: ##I1_File_ID##
      filename: ##I1_Filename##
      filetype: ##I1_Filetype##
      filesize: ##I1_File_Size##
      url: ##I1_URL##
      urltype: ##I1_URL_Type##
      md5: ##I1_MD5##
- !Read
    read_id: index_2
    name: Index 2 (i5 index)
    modality: rna
    primer_id: truseq_read1
    min_len: 10
    max_len: 10
    strand: neg
    files:
    - !File
      file_id: ##I2_File_ID##
      filename: ##I2_Filename##
      filetype: ##I2_Filetype##
      filesize: ##I2_File_Size##
      url: ##I2_URL##
      urltype: ##I2_URL_Type##
      md5: ##I2_MD5##
- !Read
  read_id: read_2
  name: Read 2
  modality: rna
  primer_id: truseq_read2
  min_len: 90
  max_len: 90
  strand: neg
  files:
  - !File
    file_id: ##R2_File_ID##
    filename: ##R2_Filename##
    filetype: ##R2_Filetype##
    filesize: ##R2_File_Size##
    url: ##R2_URL##
    urltype: ##R2_URL_Type##
    md5: ##R2_MD5##

library_spec: ##Adjust cdna length according to sequence depth##
- !Region
  region_id: rna
  region_type: named
  name: rna
  sequence_type: joined
  sequence: AATGATACGGCGACCACCGAGATCTACACNNNNNNNNNNTCTTTCCCTACACGACGCTCTTCCGATCTNNNNNNNNNNNNNNNNXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXAGATCGGAAGAGCACACGTCTGAACTCCAGTCACNNNNNNNNNNATCTCGTATGCCGTCTTCTGCTTG
  min_len: 254
  max_len: 254
  onlist: null
  parent_id: null
  regions:
  - !Region
    parent_id: rna
    region_id: P5
    region_type: illumina_p5
    name: Illumina P5 Primer
    sequence_type: fixed
    sequence: AATGATACGGCGACCACCGAGATCTACAC
    min_len: 29
    max_len: 29
    onlist: null
    regions: []

  - !Region
    parent_id: rna
    region_id: i5_index
    region_type: index5
    name: Illumina i5 Index
    sequence_type: onlist
    sequence: NNNNNNNNNN
    min_len: 10
    max_len: 10
    onlist: !Onlist
      file_id: dual_i5.txt
      filename: dual_i5.txt
      filetype: txt
      filesize: 1055
      url: https://caltech-bioinformatics-resource-center.github.io/Tutorials/seqspec/onlists/10x/dual_i5.txt
      urltype: https
      md5: "74722e3ba2638b46b241ad9970aba57f"
    regions: []

  - !Region
    parent_id: rna
    region_id: truseq_read1
    region_type: truseq_read1
    name: Truseq Read 1
    sequence_type: fixed
    sequence: TCTTTCCCTACACGACGCTCTTCCGATCT
    min_len: 29
    max_len: 29
    onlist: null
    regions: []

  - !Region
    parent_id: rna
    region_id: BC
    region_type: barcode
    name: Cell Barcode
    sequence_type: onlist
    sequence: NNNNNNNNNNNNNNNN
    min_len: 16
    max_len: 16
    onlist: !Onlist
      file_id: BC.txt.gz
      filename: BC.txt.gz
      filetype: txt
      filesize: 13390930
      url: https://caltech-bioinformatics-resource-center.github.io/Tutorials/seqspec/onlists/10x/v4/BC.txt.gz
      urltype: https
      md5: "3e6ed2f6b5e82b0edfd4a28e790d6b9b"
    regions: []

  - !Region
    parent_id: rna
    region_id: umi
    region_type: umi
    name: UMI
    sequence_type: random
    sequence: XXXXXXXXXXXX
    min_len: 12
    max_len: 12
    onlist: null
    regions: []

  - !Region
    parent_id: rna
    region_id: cdna
    region_type: cdna
    name: cDNA
    sequence_type: random
    sequence: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    min_len: 90
    max_len: 90
    onlist: null
    regions: []

  - !Region
    parent_id: rna
    region_id: truseq_read2
    region_type: truseq_read2
    name: Truseq Read 2
    sequence_type: fixed
    sequence: AGATCGGAAGAGCACACGTCTGAACTCCAGTCAC
    min_len: 34
    max_len: 34
    onlist: null
    regions: []

  - !Region
    parent_id: rna
    region_id: illumina_i7
    region_type: index7
    name: Illumina i7 Index
    sequence_type: onlist
    sequence: NNNNNNNNNN
    min_len: 10
    max_len: 10
    onlist: !Onlist
      file_id: dual_i7.txt
      filename: dual_i7.txt
      filetype: txt
      filesize: 1055
      url: https://caltech-bioinformatics-resource-center.github.io/Tutorials/seqspec/onlists/10x/dual_i7.txt
      urltype: https
      md5: "f9849391f7afb67671e8d189587effe2"
    regions: []

  - !Region
    parent_id: rna
    region_id: illumina_p7
    region_type: illumina_p7
    name: Illumina P7 primer
    sequence_type: fixed
    sequence: ATCTCGTATGCCGTCTTCTGCTTG
    min_len: 24
    max_len: 24
    onlist: null
    regions: []
